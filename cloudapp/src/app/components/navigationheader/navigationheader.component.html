<div
    class="slskey-header ">
    <!-- Navigation Header -->
    <div class="nav-header half-rounded" fxLayout="row">
            <mat-icon *ngIf="showBackButton" class="back-button" mat-button="mat-button" (click)="navigateBack()" inline="true">arrow_back_ios</mat-icon>
       {{ title }}
    </div>

    <!-- User Header -->
    <div *ngIf="currentAlmaUser?.primary_id" class="user-header" fxLayout="row">
        <span class="user-header-user">
            <mat-icon size="20">account_circle</mat-icon>
            <div class="user-header-text">
                {{currentAlmaUser.full_name}}
            </div>
            <a [href]="getExternalUserUrl()" target="_blank" rel="noopener"
                [attr.aria-label]="'General.OpenInSlskey' | translate"
                [title]="'General.OpenInSlskey' | translate">
                <mat-icon class="external-link-icon">open_in_new</mat-icon>
            </a>
        </span>
    </div>
</div>
